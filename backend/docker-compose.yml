services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cyberguard
      POSTGRES_PASSWORD: cyberguard
      POSTGRES_DB: cyberguard
    ports:
      - "5433:5432"
    volumes:
      - cyberguard_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cyberguard:cyberguard@db:5432/cyberguard
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  cyberguard_db_data: